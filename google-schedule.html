<!doctype html>
<html lang="ko"><head>
<link rel="stylesheet" href="vendor/tabler-1.7.1/tabler.min.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모이다 · 일정·행사</title><link rel="stylesheet" href="google-schedule.css?v=calendar5"><link rel="stylesheet" href="moida-brand.css?v=3">
</head><body>
<main>
<header class="page-header"><div><span class="eyebrow">MOIDA CALENDAR</span><h1>일정·행사</h1><p>한 달의 흐름부터 오늘의 약속까지.</p></div><button id="add" class="primary">＋ 일정 등록</button></header>
<div class="source-bar"><details id="calendarPicker" class="calendar-picker"><summary id="calendarSummary">캘린더 불러오는 중…</summary><div class="calendar-options"><div class="picker-heading"><strong>표시할 캘린더</strong><button type="button" id="allCalendars">전체 선택</button></div><div id="calendarChoices"></div><p id="pickerHint">도구 연결에서 연결한 Google 계정의 캘린더입니다.</p></div></details><span id="calendarAccount" class="source-label"></span><button id="refresh">↻ 새로고침</button></div>
<section class="calendar-shell" aria-label="월간 일정"><div class="calendar-main"><nav class="month-toolbar" aria-label="달력 이동"><div class="month-navigation"><h2 id="month"></h2><div class="arrow-buttons"><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div><button id="today">오늘</button></div><span class="view-label">월간 달력</span></nav>
<div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="month-grid" role="group" aria-label="날짜 선택"></div><div class="calendar-footer"><span><i></i> 선택한 캘린더의 일정</span><p id="status" role="status">로그인 확인 중…</p></div></div>
<aside class="day-panel" aria-labelledby="selectedDate"><div class="day-panel-heading"><div><span class="eyebrow" id="selectedWeekday">선택한 날짜</span><h2 id="selectedDate"></h2></div><span id="dayCount" class="count"></span></div><section id="events" aria-label="선택한 날짜의 일정"></section><button id="addDay" class="add-day">＋ 이 날짜에 일정 추가</button></aside></section>
<footer class="page-footer"><p>일정을 누르면 내용을 확인하고 수정할 수 있습니다.</p><a href="schedule.html?embed=1">기존 모이다·FLOW 일정 보기 ↗</a></footer></main>
<dialog id="editor"><form id="form"><div class="editor-heading"><h2 id="formTitle">일정 등록</h2><button type="button" id="closeEditor" aria-label="닫기">×</button></div><label>저장할 캘린더<select id="eventCalendar" name="calendar" required></select></label><label>제목<input name="title" required maxlength="500" placeholder="어떤 일정인가요?"></label><label class="check"><input type="checkbox" name="allDay">종일</label><div class="dates"><label>시작<input name="start" type="datetime-local" required></label><label>종료<input name="end" type="datetime-local" required></label></div><small id="endHint">종료 시각을 확인해 주세요.</small><label>장소<input name="location" maxlength="1000" placeholder="장소를 입력하세요"></label><label>내용<textarea name="description" rows="4" maxlength="8000" placeholder="기억할 내용을 남겨 주세요"></textarea></label><p id="formStatus" role="status"></p><footer><button type="button" id="cancel">취소</button><button type="submit" id="save" class="primary">구글 캘린더에 저장</button></footer></form></dialog>
<script type="module" src="google-schedule.js?v=calendar5"></script>
<script src="moida-brand.js?v=3"></script>
</body></html>
