name: 새 글 도우미 실행 서버
on:
  push:
    branches: [main]
    paths: ['new-post-helper/**', '.github/workflows/deploy-new-post-helper.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: new-post-helper-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-post-helper
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0a43eeb2c6fe53d7e8e6f38d7ea96905
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx wrangler deploy
      - name: Create encryption key only on first deployment
        shell: bash
        run: |
          if ! npx wrangler secret list | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>process.exit(JSON.parse(s).some(x=>x.name==="FB_SESSION_KEY")?0:1))'; then
            openssl rand -hex 32 | npx wrangler secret put FB_SESSION_KEY
          fi
