name: 공지사항 크롤링

on:
  push:
    branches: [main]
    paths: ['.github/workflows/crawl.yml']
  schedule:
    - cron: '*/5 * * * *'  # 5분마다 최신 자료 확인
  workflow_dispatch:      # 수동 실행 가능

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 패키지 설치
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python3 -m playwright install chromium --with-deps

      - name: 공지사항 크롤링
        run: |
          python3 - <<'EOF'
          import json, time
          from datetime import datetime, timezone
          import requests
          from bs4 import BeautifulSoup

          now_utc = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          PROXIES = [
              "https://corsproxy.io/?{url}",
              "https://api.codetabs.com/v1/proxy?quest={url}",
              "https://api.allorigins.win/raw?url={url}",
          ]

          def fetch(url, extra_headers=None):
              headers = {"Origin": "https://corsproxy.io", "User-Agent": "Mozilla/5.0"}
              if extra_headers:
                  headers.update(extra_headers)
              for tmpl in PROXIES:
                  proxy_url = tmpl.format(url=url)
                  try:
                      r = requests.get(proxy_url, timeout=20, headers=headers)
                      if r.status_code == 200 and len(r.content) > 500:
                          print(f"  OK [{r.status_code}] via {proxy_url[:50]}")
                          r.encoding = "utf-8"
                          return r.text
                      print(f"  FAIL [{r.status_code}] via {proxy_url[:50]}")
                  except Exception as e:
                      print(f"  ERROR {e}")
              return None

          # ── 경기도당 (minjookg.kr) ──────────────────────────────────────
          GY_BASE = "https://www.minjookg.kr"
          GY_URL  = f"{GY_BASE}/sub01_news/notice.php"
          GY_PAGES = 4

          def parse_gy(li, category="일반"):
              a = li.select_one("a[href]")
              if not a:
                  return None
              for s in a.select("span.label, span.no"):
                  s.decompose()
              title = a.get_text(strip=True)
              href  = a.get("href", "")
              if not href.startswith("http"):
                  href = GY_BASE + (href if href.startswith("/") else "/" + href)
              date_el  = li.select_one("span.date")
              date_str = date_el.get_text(strip=True).replace("/", "-").strip() if date_el else ""
              return {"title": title, "date": date_str, "link": href, "category": category} if title and len(title) > 2 else None

          gy_notices, gy_seen = [], set()
          for page in range(1, GY_PAGES + 1):
              print(f"\n[경기도당] 페이지 {page}")
              html = fetch(f"{GY_URL}?board_page={page}")
              if not html:
                  continue
              soup = BeautifulSoup(html, "lxml")
              if page == 1:
                  for li in soup.select(".notice ul li"):
                      item = parse_gy(li, "공지")
                      if item and item["link"] not in gy_seen:
                          gy_seen.add(item["link"]); gy_notices.append(item)
              for li in soup.select(".list_A ul li"):
                  item = parse_gy(li, "일반")
                  if item and item["link"] not in gy_seen:
                      gy_seen.add(item["link"]); gy_notices.append(item)
              time.sleep(0.5)

          print(f"\n경기도당 수집: {len(gy_notices)}건")
          with open("notices_data.json", "w", encoding="utf-8") as f:
              json.dump({"updated": now_utc, "items": gy_notices}, f, ensure_ascii=False, indent=2)

          # ── 중앙당 (theminjoo.kr) — Playwright (직접요청·프록시 모두 403) ──
          from urllib.parse import urljoin
          import re as _rect
          from playwright.sync_api import sync_playwright as _spw_ct

          CT_BASE  = "https://theminjoo.kr"
          CT_URL   = f"{CT_BASE}/main/sub/news/list.php?brd=1"
          CT_PER   = 20
          CT_PAGES = 3
          CT_DATE  = _rect.compile(r'20\d\d\s*[.\-/]\s*\d{1,2}\s*[.\-/]\s*\d{1,2}')

          ct_notices, ct_seen = [], set()

          # 구조에 의존하지 않는 파서: 날짜가 가까이 있는 링크를 공지로 간주
          def parse_ct(html, page_url):
              soup = BeautifulSoup(html, "lxml")
              added = 0
              for a in soup.select("a[href]"):
                  title = a.get_text(" ", strip=True)
                  if not title or len(title) < 5:
                      continue
                  href = urljoin(page_url, a.get("href", ""))
                  low = href.lower()
                  if "list.php" in low or "javascript" in low or href.endswith("#"):
                      continue
                  date_str, node = "", a
                  for _ in range(5):
                      if node is None:
                          break
                      m = CT_DATE.search(node.get_text(" ", strip=True))
                      if m:
                          date_str = m.group(0)
                          break
                      node = node.parent
                  if not date_str or href in ct_seen:
                      continue
                  ds = _rect.sub(r'\s', '', _rect.sub(r'[./]', '-', date_str))
                  parts = [p for p in ds.split("-") if p]
                  if len(parts) >= 3:
                      ds = f"{parts[0]}-{int(parts[1]):02d}-{int(parts[2]):02d}"
                  holder = a.find_parent(["tr", "li", "div"])
                  cls = " ".join(holder.get("class", [])) if holder else ""
                  category = "공지" if ("공지" in title or "notice" in cls.lower()) else "일반"
                  ct_seen.add(href)
                  ct_notices.append({"title": title, "date": ds, "link": href, "category": category})
                  print(f"  {ds} [{category}] {title[:40]}")
                  added += 1
              return added

          try:
              with _spw_ct() as pw:
                  browser = pw.chromium.launch(headless=True)
                  ctx = browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                      locale="ko-KR", viewport={"width": 1280, "height": 800})
                  pg = ctx.new_page()
                  for page in range(1, CT_PAGES + 1):
                      sno = (page - 1) * CT_PER
                      page_url = f"{CT_URL}&sno={sno}"
                      print(f"\n[중앙당] 페이지 {page} (sno={sno})")
                      try:
                          pg.goto(page_url, wait_until="networkidle", timeout=30000)
                          time.sleep(1.0)
                          cnt = parse_ct(pg.content(), page_url)
                          print(f"  → {cnt}건 추가 (누계 {len(ct_notices)}건)")
                      except Exception as e:
                          print(f"  페이지{page} ERROR: {e}")
                      time.sleep(1)
                  browser.close()
          except Exception as e:
              print(f"중앙당 Playwright ERROR: {e}")

          print(f"\n중앙당 수집: {len(ct_notices)}건")
          # 0건이면 기존 파일 유지 (실패한 크롤이 좋은 데이터를 덮어쓰지 않도록)
          if ct_notices:
              with open("central_data.json", "w", encoding="utf-8") as f:
                  json.dump({"updated": now_utc, "items": ct_notices}, f, ensure_ascii=False, indent=2)
          else:
              print("  수집 실패 — 기존 central_data.json 유지")

          # ── 경기도의회 (ggc.go.kr) ──────────────────────────────────────
          import re as _re
          from playwright.sync_api import sync_playwright

          GC_BASE  = "https://www.ggc.go.kr"
          GC_URL   = f"{GC_BASE}/site/main/board/pblcntc/list"
          GC_PAGES = 5

          gc_notices, gc_seen = [], set()

          def parse_gc_html(html, page_url):
              soup = BeautifulSoup(html, "lxml")
              count = 0
              for row in soup.select("tbody tr"):
                  a = row.select_one("td a[href]")
                  if not a:
                      continue
                  title = a.get_text(strip=True)
                  href = urljoin(page_url, a.get("href", ""))
                  if not title or len(title) < 3 or href in gc_seen:
                      continue
                  date_str = ""
                  for td in row.select("td"):
                      t = td.get_text(strip=True)
                      if _re.search(r'20\d\d[.\-]\d\d[.\-]\d\d', t):
                          date_str = t
                          break
                  row_class = " ".join(row.get("class", []))
                  is_notice = "notice" in row_class or row.select_one(".notice,.noti,.important") is not None
                  category = "공지" if is_notice else "일반"
                  gc_seen.add(href)
                  gc_notices.append({"title": title, "date": date_str, "link": href, "category": category})
                  print(f"  {date_str} [{category}] {title[:40]}")
                  count += 1
              return count

          # Playwright로만 가능 (직접 요청/프록시 모두 403)
          # cp=N URL 파라미터로 각 페이지 직접 이동
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              ctx = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                  locale="ko-KR",
                  viewport={"width": 1280, "height": 800},
              )
              page_pw = ctx.new_page()
              for pg in range(1, GC_PAGES + 1):
                  page_url = f"{GC_URL}?cp={pg}"
                  print(f"\n[경기도의회] 페이지 {pg}")
                  try:
                      page_pw.goto(page_url, wait_until="networkidle", timeout=30000)
                      html = page_pw.content()
                      cnt = parse_gc_html(html, GC_URL)
                      print(f"  → {cnt}건 추가 (누계 {len(gc_notices)}건)")
                  except Exception as e:
                      print(f"  페이지{pg} ERROR: {e}")
                  time.sleep(1)
              browser.close()

          print(f"\n경기도의회 수집: {len(gc_notices)}건")
          # 0건이면 기존 파일 유지
          if gc_notices:
              with open("council_data.json", "w", encoding="utf-8") as f:
                  json.dump({"updated": now_utc, "items": gc_notices}, f, ensure_ascii=False, indent=2)
          else:
              print("  수집 실패 — 기존 council_data.json 유지")

          # ── 장윤정 의원 대표·공동발의 (공지사항과 동일한 실제 브라우저 방식) ──
          BILL_PROFILE = "https://www.ggc.go.kr/site/lwmkr/blog/11017/11"
          bill_summaries, bill_seen = [], set()

          def add_bill_links(html, current_url):
              soup = BeautifulSoup(html, "lxml")
              added = 0
              for a in soup.select('a[href*="motionBillList/DetailView/"]'):
                  href = urljoin(current_url, a.get("href", ""))
                  if not href or href in bill_seen:
                      continue
                  bill_seen.add(href)
                  bill_summaries.append(href)
                  added += 1
              return added

          def bill_value(soup, label):
              for tag in soup.find_all(["th", "dt"]):
                  if tag.get_text(" ", strip=True) == label:
                      nxt = tag.find_next_sibling(["td", "dd"])
                      return nxt.get_text(" ", strip=True) if nxt else ""
              return ""

          collected_bills = []
          try:
              with sync_playwright() as pw:
                  browser = pw.chromium.launch(headless=True)
                  ctx = browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
                      locale="ko-KR", viewport={"width": 1280, "height": 900})
                  bp = ctx.new_page()
                  bp.goto(BILL_PROFILE, wait_until="networkidle", timeout=60000)
                  add_bill_links(bp.content(), bp.url)
                  list_anchor = bp.locator('a[href*="motionBillList"]:not([href*="DetailView"])').first
                  if list_anchor.count():
                      list_anchor.click()
                      bp.wait_for_load_state("domcontentloaded", timeout=60000)
                      list_url = bp.url
                      listed_pages = set()
                      for page_no in range(1, 51):
                          u = list_url + ("&" if "?" in list_url else "?") + f"pageIndex={page_no}"
                          bp.goto(u, wait_until="domcontentloaded", timeout=60000)
                          bp.wait_for_timeout(700)
                          before = len(bill_summaries)
                          add_bill_links(bp.content(), bp.url)
                          signature = "|".join(bill_summaries[before:])
                          if not signature or signature in listed_pages:
                              break
                          listed_pages.add(signature)

                  for idx, href in enumerate(bill_summaries, 1):
                      try:
                          bp.goto(href, wait_until="domcontentloaded", timeout=60000)
                          bp.wait_for_timeout(250)
                          detail = BeautifulSoup(bp.content(), "lxml")
                          lead = bill_value(detail, "대표발의")
                          co = bill_value(detail, "공동발의")
                          if "장윤정" not in lead and "장윤정" not in co:
                              continue
                          results = []
                          for tag in detail.find_all(["th", "dt"]):
                              if tag.get_text(" ", strip=True) == "처리결과":
                                  nxt = tag.find_next_sibling(["td", "dd"])
                                  value = nxt.get_text(" ", strip=True) if nxt else ""
                                  if value:
                                      results.append(value)
                          bill_no = bill_value(detail, "의안번호")
                          detail_id = _re.search(r"DetailView/\d+/(\d+)", href)
                          title = detail.find("h2")
                          title = title.get_text(" ", strip=True) if title else bill_no
                          stage = results[-1] if results else "처리현황 확인 중"
                          collected_bills.append({
                              "id": detail_id.group(1) if detail_id else bill_no,
                              "billNo": bill_no, "name": title,
                              "kind": "대표발의" if "장윤정" in lead else "공동발의",
                              "leadSponsor": lead, "coSponsors": co,
                              "committee": bill_value(detail, "소관위원회"),
                              "proposedAt": bill_value(detail, "제안일").replace(".", "-").replace("/", "-"),
                              "proposalSession": bill_value(detail, "제안회기"),
                              "committeeResult": results[0] if results else "",
                              "plenaryResult": results[-1] if len(results) > 1 else "",
                              "stage": stage,
                              "progress": 100 if _re.search(r"가결|통과|공포|폐기|부결|철회", stage) else 30,
                              "source": "ggc", "sourceUrl": href,
                          })
                          print(f"  [정책 {idx}/{len(bill_summaries)}] {bill_no} {title[:35]}")
                      except Exception as e:
                          print(f"  정책 상세 ERROR {href}: {e}")
                  browser.close()
          except Exception as e:
              print(f"정책 Playwright ERROR: {e}")

          # 기존 검증 자료와 합쳐 크롤링 오류로 의안이 사라지지 않게 한다.
          existing_bills = []
          try:
              with open("bills_data.json", encoding="utf-8") as f:
                  existing_bills = json.load(f).get("bills", [])
          except Exception:
              pass
          merged = {}
          for item in existing_bills + collected_bills:
              key = str(item.get("id") or item.get("billNo") or item.get("sourceUrl") or "")
              if key:
                  merged[key] = item
          final_bills = sorted(merged.values(), key=lambda x: str(x.get("proposedAt", "")), reverse=True)
          if collected_bills:
              with open("bills_data.json", "w", encoding="utf-8") as f:
                  json.dump({"updatedAt": now_utc, "source": "경기도의회 실제 브라우저 자동수집", "bills": final_bills}, f, ensure_ascii=False, indent=2)
              print(f"정책 수집 {len(collected_bills)}건 / 누적 {len(final_bills)}건")
          else:
              print("정책 수집 실패 — 기존 bills_data.json 유지")

          EOF

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notices_data.json central_data.json council_data.json bills_data.json
          git diff --cached --quiet || git commit -m "chore: 공지사항 데이터 업데이트 $(date +'%Y-%m-%d %H:%M')"
          git push
