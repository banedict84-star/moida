name: Build Galaxy call link
on:
  push:
    branches: [main]
    paths: ['android-call-link/**', '.github/workflows/build-call-link.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug
        working-directory: android-call-link
      - uses: actions/upload-artifact@v4
        with:
          name: moida-call-link-apk
          path: android-call-link/app/build/outputs/apk/debug/app-debug.apk
