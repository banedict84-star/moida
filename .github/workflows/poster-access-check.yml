name: Poster deployment access check
on:
  push:
    branches: ['codex/poster-scene-api']
    paths: ['.github/workflows/poster-access-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing Cloudflare access without revealing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Existing CLOUDFLARE_API_TOKEN is absent; no credential was created.');
          const base = 'https://api.cloudflare.com/client/v4/accounts/0a43eeb2c6fe53d7e8e6f38d7ea96905';
          async function read(path, options = {}) {
            const response = await fetch(base + path, {
              ...options, headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }
            });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(`Cloudflare access failed: HTTP ${response.status}; codes ${(data.errors || []).map(e => e.code).join(',')}`);
            return data.result;
          }
          const secrets = await read('/workers/scripts/moida-gpt/secrets');
          const present = secrets.some(s => s.name === 'GEMINI_API_KEY');
          console.log(JSON.stringify({ existingCloudflareAccess: true, existingGeminiBinding: present }));
          if (!present) throw new Error('Existing Worker GEMINI_API_KEY binding is absent; no secret was copied.');
          await read('/d1/database/ff423e24-10cd-40fb-9331-d13c803ba54d/query', { method: 'POST', body: JSON.stringify({ sql: 'SELECT 1 AS access_check' }) });
          console.log('Existing D1 query access: confirmed; no schema or data changed.');
          const health = await fetch('https://moida-gpt.banedict84.workers.dev/health');
          const data = await health.json();
          console.log(JSON.stringify({ healthStatus: health.status, gemini: data.gemini === true, database: data.database === true }));
          if (!health.ok || data.gemini !== true || data.database !== true) throw new Error('Existing Worker health prerequisites are not ready.');
          JS
