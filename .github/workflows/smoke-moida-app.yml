name: Smoke test Moida Android app
on:
  push:
    branches: [main]
    paths: ['.github/workflows/smoke-moida-app.yml']
  workflow_run:
    workflows: ['Build Moida Android app']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download released install file
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' https://github.com/banedict84-star/moida/releases/download/moida-app-latest/moida.apk -o moida.apk
          curl --fail --location --proto '=https' --proto-redir '=https' https://github.com/banedict84-star/moida/releases/download/moida-app-latest/moida.apk.sha256 -o moida.apk.sha256
          sha256sum -c moida.apk.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p smoke-results
            adb install moida.apk
            adb shell am start -W -n kr.moida.office/.MainActivity
            sleep 10
            adb shell uiautomator dump /sdcard/moida-site.xml
            adb pull /sdcard/moida-site.xml smoke-results/moida-site.xml
            adb shell screencap -p /sdcard/moida-site.png
            adb pull /sdcard/moida-site.png smoke-results/moida-site.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell uiautomator dump /sdcard/moida-home.xml
            adb pull /sdcard/moida-home.xml smoke-results/moida-home.xml
            grep -q '비서실 들어가기' smoke-results/moida-home.xml
            grep -q '뉴스 숏츠' smoke-results/moida-home.xml
            adb shell screencap -p /sdcard/moida-home.png
            adb pull /sdcard/moida-home.png smoke-results/moida-home.png
            adb shell input swipe 250 750 250 200 500
            adb shell uiautomator dump /sdcard/moida-footer.xml
            adb pull /sdcard/moida-footer.xml smoke-results/moida-footer.xml
            grep -q '앱 업데이트 확인' smoke-results/moida-footer.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moida-android-smoke
          path: smoke-results/
