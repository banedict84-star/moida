<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모이다 · 자체 일정</title><link rel="stylesheet" href="moida-schedule.css?v=projects2"><link rel="stylesheet" href="vendor/tabler-1.7.1/tabler.min.css"><link rel="stylesheet" href="moida-tabler.css?v=8"><link rel="stylesheet" href="moida-brand.css?v=3">
</head><body data-bs-theme="light">
<main>
<header><div><small>MOIDA CALENDAR</small><h1>의원실 일정</h1><p>함께 확인하고, 모이다에서 관리하세요.</p></div><button id="add" class="primary">＋ 일정 등록</button></header>
<div class="workspace"><aside class="sidebar"><h2>일정 보기</h2><label><input type="radio" name="scope" value="all" checked> 전체 일정</label><label><input type="radio" name="scope" value="mine"> 내가 등록한 일정</label><div class="projects-head"><h2>내 프로젝트</h2><button id="projectAdd" type="button" aria-label="새 프로젝트 만들기">＋</button></div><div id="projectList"></div><p id="projectStatus" role="status"></p><h2>카테고리</h2><div id="categories"></div><div class="sidebar-foot"><strong>모이다 자체 캘린더</strong><p>등록한 일정은 의원실에 저장됩니다.</p><button type="button" id="googleInline">구글 캘린더 연결·표시</button></div></aside>
<section class="content"><nav><div class="date-nav"><button id="prev" aria-label="이전 기간">‹</button><h2 id="period"></h2><button id="next" aria-label="다음 기간">›</button><button id="today">오늘</button></div><div class="views" aria-label="일정 보기 방식"><button data-view="feed" aria-pressed="false">피드</button><button data-view="month" aria-pressed="true">월</button><button data-view="week" aria-pressed="false">주</button><button data-view="list" aria-pressed="false">목록</button></div></nav>
<div class="tools"><input id="search" type="search" aria-label="일정 검색" placeholder="제목, 장소, 참석자 검색"><div id="googleSources"></div><span id="count"></span></div><p id="status" role="status">의원실 일정을 불러오는 중…</p><div id="calendar" aria-label="일정 달력"></div><div id="list" hidden></div><div id="feed" hidden></div></section>
<aside class="day-panel"><div class="panel-head"><small id="weekday"></small><h2 id="selectedDate"></h2><span id="dayCount"></span></div><div id="dayEvents"></div><button id="addDay">＋ 이 날짜에 일정 추가</button></aside></div>
</main>
<dialog id="editor"><form id="form"><div class="editor-head"><h2 id="editorTitle">일정 등록</h2><button type="button" id="close" aria-label="닫기">×</button></div><label>프로젝트<select name="projectId" required></select></label><label>제목<input name="title" required maxlength="300" placeholder="일정 제목을 입력하세요"></label><div class="pair"><label>카테고리<select name="category"></select></label><label class="check"><input name="allDay" type="checkbox"> 종일</label></div><div class="pair"><label>시작<input name="start" type="datetime-local" required></label><label>종료<input name="end" type="datetime-local" required></label></div><label>장소<input name="location" maxlength="1000" placeholder="장소 또는 주소"></label><label>참석자<input name="attendees" maxlength="1000" placeholder="이름을 쉼표로 구분해 주세요"></label><label>내용<textarea name="body" rows="4" maxlength="8000" placeholder="준비사항과 메모를 남겨 주세요"></textarea></label><p id="author"></p><p id="conflict"></p><p id="formStatus" role="status"></p><footer><button id="remove" type="button" class="danger" hidden>일정 삭제</button><button id="cancel" type="button">취소</button><button id="save" class="primary" type="submit">모이다에 저장</button></footer></form></dialog>
<dialog id="projectEditor"><form id="projectForm"><h2 id="projectTitle">새 프로젝트</h2><label>프로젝트 이름<input name="name" required maxlength="80" placeholder="예: 굿엔레더 수업일정"></label><label>프로젝트 색상<input type="color" name="color" value="#8d68bd" required></label><label>일정 저장 위치<select name="calendarId"></select></label><p class="project-help">구글 캘린더를 선택하면 새 일정은 그 캘린더에 저장되고, 기존 구글 일정도 이 프로젝트 색상으로 표시됩니다. 모이다의 기존 일정은 자동으로 옮기지 않습니다.</p><p id="projectMessage" role="status"></p><footer><button type="button" id="projectCancel">취소</button><button type="submit" id="projectSave" class="primary">프로젝트 저장</button></footer></form></dialog>
<script type="module" src="moida-schedule.js?v=projects1"></script>
<script src="moida-brand.js?v=3"></script>
</body></html>
