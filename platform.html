<script>

  function buildOfficeOrganization(){

  var DEFAULT_SPEECH={schedule:'다음 일정을 확인하고 있어요.',promotion:'홍보 자료를 정리하고 있어요.',policy:'정책 자료를 검토하고 있어요.'};

  function setAgent(type,status,speech){

      var line=document.querySelector('[data-network-line="'+type+'"]'),signal=document.querySelector('[data-network-signal="'+type+'"]');

  function secretarySpeech(status){

  }
  function taskSpeech(task){

  }
  function time(ts){var d=new Date(+ts||Date.now());return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  function render(runs){

      });

    });
